name: CodeQL
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '31 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    uses: Oxiom-Systems/watch-my-ai-doing/.github/workflows/ci-codeql-recipe.yml@1958e642fcde77604b4f8c3afe31b5a18f8fe7cf
    with:
      # Root flips this literal only after canaries and managed-default retirement.
      upload_results: false
