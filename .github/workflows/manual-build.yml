name: Manual Android build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a public GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build phone and watch APKs
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WMAID_DEMO_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/wmaid-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wmaid-signing/demo-release.jks"

      - name: Build signed release APKs
        env:
          WMAID_KEYSTORE_FILE: ${{ runner.temp }}/wmaid-signing/demo-release.jks
          WMAID_KEYSTORE_PASSWORD: ${{ secrets.WMAID_DEMO_KEYSTORE_PASSWORD }}
          WMAID_KEY_ALIAS: ${{ secrets.WMAID_DEMO_KEY_ALIAS }}
          WMAID_KEY_PASSWORD: ${{ secrets.WMAID_DEMO_KEY_PASSWORD }}
        run: ./gradlew clean :phone:assembleRelease :wear:assembleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp phone/build/outputs/apk/release/phone-release.apk dist/WMAID-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk dist/WMAID-watch.apk
          cd dist
          sha256sum WMAID-phone.apk WMAID-watch.apk > SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wmaid-signed-apks-${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: Publish opt-in prerelease
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "showcase-${GITHUB_RUN_NUMBER}" \
            dist/WMAID-phone.apk \
            dist/WMAID-watch.apk \
            dist/SHA256SUMS.txt \
            --prerelease \
            --title "WMAID showcase ${GITHUB_RUN_NUMBER}" \
            --notes "Manually published emulator-first showcase APKs. These are not a Play Store production release."
