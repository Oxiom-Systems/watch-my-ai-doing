name: Manual Android build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed APKs as a public GitHub prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    uses: Oxiom-Systems/watch-my-ai-doing/.github/workflows/ci-build-recipe.yml@7e3f7b10a2d997fa1089551b62e243841008db20
  sign-and-publish:
    needs: build
    if: github.repository_id == '1317333090' && github.ref_protected == true && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    uses: Oxiom-Systems/watch-my-ai-doing/.github/workflows/ci-sign-recipe.yml@378b75250669e543e740588cbfec89a68aa4070e
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      artifact_id: ${{ needs.build.outputs.artifact-id }}
      publish_release: ${{ inputs.publish_release }}
